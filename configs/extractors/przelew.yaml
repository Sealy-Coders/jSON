document_type: przelew
fields:
  # Kolejność etykiet = priorytet. Data wygenerowania potwierdzenia ('wygenerowano')
  # celowo NIE jest etykietą — to nie jest data operacji.
  - path: przelew_bankowy.data_operacji
    method: labeled_date
    labels:
      - data wykonania
      - data operacji
      - data transakcji
      - data realizacji
      - data przelewu
      - data księgowania
      - data obciążenia
      - data zlecenia
      - zrealizowano w dniu
      - wykonano w dniu
      - w dniu
  # Tylko etykiety „kwota…” — opłata/prowizja/wpis nigdy nie są kwotą przelewu.
  - path: przelew_bankowy.kwota
    method: labeled_amount
    labels:
      - kwota przelewu
      - kwota operacji
      - kwota transakcji
      - kwota
      - wartość
  - path: przelew_bankowy.z_rachunku
    method: labeled_account
    labels:
      - z rachunku
      - rachunek nadawcy
      - nr rachunku nadawcy
      - rachunek zleceniodawcy
      - rachunek obciążany
      - płatnik
  - path: przelew_bankowy.na_rachunek
    method: labeled_account
    labels:
      - rachunek beneficjenta
      - rachunek odbiorcy
      - na rachunek
      - nr rachunku odbiorcy
      - rachunek uznawany
      - beneficjent
  - path: przelew_bankowy.numer_transakcji
    method: labeled_text
    labels:
      - numer transakcji
      - nr transakcji
      - numer referencyjny
      - nr ref
      - referencja
      - id transakcji
    normalize: transaction_id
  # Blok tytułu: od etykiety do pierwszej linii zaczynającej się od etykiety stopu.
  - path: przelew_bankowy.tytul
    method: labeled_multiline
    labels:
      - tytułem
      - tytuł przelewu
      - tytul przelewu
      - tytuł operacji
      - tytuł
      - opis operacji
      - opis przelewu
      - opis
      - szczegóły płatności
    stop_labels:
      - nr ref
      - numer referencyjny
      - numer transakcji
      - id transakcji
      - identyfikator
      - referencja
      - wartość
      - status
      - waluta
      - typ operacji
      - zrealizowano
      - wykonano
      - data
      - kwota
      - rachunek
      - opłata/prowizja
      - prowizja
      - kanał
      - potwierdzenie ma charakter
      - bank nie ponosi
    max_lines: 4
